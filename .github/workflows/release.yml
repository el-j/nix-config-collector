name: Release

on:
  # Triggered automatically on every merge/push to main — GitVersion
  # computes the next semantic version and a new release is created only
  # when the computed tag does not already exist (idempotent).
  push:
    branches: [main, master]
    # Also triggered when a semver tag is pushed directly (e.g. hotfix).
    tags:
      - 'v[0-9]+\.[0-9]+\.[0-9]+'

  # Allows a one-click release directly from the GitHub UI.
  # GitVersion derives the next semantic version from commit history and
  # Conventional Commits — no manual version input required.
  workflow_dispatch:

permissions:
  contents: write

# Prevent concurrent releases to avoid race conditions on the main branch.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────────────────────
  # Derive the next semantic version automatically using
  # GitVersion 6, driven by Conventional Commits on main.
  # Outputs: version (e.g. 1.2.3) and tag (e.g. v1.2.3).
  # ─────────────────────────────────────────────────────────────
  gitversion:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.gv.outputs.semVer }}
      tag:     v${{ steps.gv.outputs.semVer }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup GitVersion
        uses: gittools/actions/gitversion/setup@v4.3.3
        with:
          versionSpec: '6.x'

      - name: Execute GitVersion
        id: gv
        uses: gittools/actions/gitversion/execute@v4.3.3
        with:
          useConfigFile: true

  # ─────────────────────────────────────────────────────────────
  # For branch-push and manual-dispatch triggers: check whether the
  # computed release tag already exists, then create it if not.
  # Outputs `skip=true` when the release already exists so all
  # downstream jobs are bypassed idempotently (e.g. the chore commit
  # from the Homebrew formula update won't re-trigger a duplicate release).
  # Skipped entirely on direct tag-push triggers (tag already exists).
  # ─────────────────────────────────────────────────────────────
  create-tag:
    needs: [gitversion]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if release already exists
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.gitversion.outputs.tag }}
        run: |
          if gh release view "${TAG}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists – skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push annotated tag
        if: steps.check.outputs.skip == 'false'
        env:
          TAG: ${{ needs.gitversion.outputs.tag }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "${TAG}"

  # ─────────────────────────────────────────────────────────────
  # Gate the release on a clean test run.
  # `create-tag` is skipped on tag-push events; the `if` guard
  # ensures this job still runs in both trigger paths.
  # Skipped when `create-tag` reports the release already exists.
  # ─────────────────────────────────────────────────────────────
  test:
    needs: [gitversion, create-tag]
    if: >-
      always() &&
      needs.gitversion.result == 'success' &&
      (needs.create-tag.result == 'skipped' ||
      (needs.create-tag.result == 'success' && needs.create-tag.outputs.skip != 'true'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -v -race ./...

  # ─────────────────────────────────────────────────────────────
  # Cross-compile CLI for all supported platforms in parallel.
  # ─────────────────────────────────────────────────────────────
  build:
    needs: [gitversion, test]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
          - runner: ubuntu-latest
            goos: linux
            goarch: arm64
          - runner: ubuntu-latest
            goos: darwin
            goarch: amd64
          - runner: macos-latest
            goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Build CLI binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go build \
            -ldflags="-s -w -X main.version=${{ needs.gitversion.outputs.version }}" \
            -o "dist/nix-config-collector-${{ matrix.goos }}-${{ matrix.goarch }}" \
            ./cmd/cli/

      - name: Upload CLI binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/nix-config-collector-${{ matrix.goos }}-${{ matrix.goarch }}
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────
  # Build the Wails desktop app for macOS as a universal binary
  # (arm64 + amd64) so it runs on both Apple Silicon and Intel Macs.
  # Ad-hoc code-signing prevents macOS Gatekeeper from blocking the app.
  # ─────────────────────────────────────────────────────────────
  build-desktop:
    needs: [gitversion, test]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: macos-latest
            platform: darwin/universal
            arch: universal
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0

      - name: Build desktop app
        run: |
          wails build \
            -platform ${{ matrix.platform }} \
            -ldflags "-X main.version=${{ needs.gitversion.outputs.version }}"

      - name: Ad-hoc sign app bundle
        run: codesign --deep --force --verbose --sign - build/bin/nix-config-collector.app

      - name: Package app bundle
        run: |
          cd build/bin
          zip -r "../../nix-config-collector-desktop-darwin-${{ matrix.arch }}.zip" "nix-config-collector.app"

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-darwin-${{ matrix.arch }}
          path: nix-config-collector-desktop-darwin-${{ matrix.arch }}.zip
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────
  # Collect all artifacts, publish the GitHub Release, and keep
  # the Homebrew formula in sync.
  # ─────────────────────────────────────────────────────────────
  release:
    needs: [gitversion, build, build-desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # Collect every CLI binary into dist/
      - name: Download CLI binaries
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true
          path: dist/

      # Collect every desktop bundle into dist/
      - name: Download desktop bundles
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: dist/

      # Generate a single checksums file covering all release assets
      - name: Generate SHA256 checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt

      # Publish the GitHub Release with all assets
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name:               ${{ needs.gitversion.outputs.tag }}
          name:                   "nix-config-collector ${{ needs.gitversion.outputs.tag }}"
          generate_release_notes: true
          make_latest:            true
          files: |
            dist/nix-config-collector-linux-amd64
            dist/nix-config-collector-linux-arm64
            dist/nix-config-collector-darwin-amd64
            dist/nix-config-collector-darwin-arm64
            dist/nix-config-collector-desktop-darwin-universal.zip
            dist/SHA256SUMS.txt

      # Keep Formula/nix-config-collector.rb pointing at the new release
      - name: Update Homebrew formula
        env:
          TAG: ${{ needs.gitversion.outputs.tag }}
        run: |
          TARBALL_URL="https://github.com/el-j/nix-config-collector/archive/refs/tags/${TAG}.tar.gz"

          # Compute the SHA256 of the source tarball that Homebrew will fetch
          SHA256=$(curl -sL "${TARBALL_URL}" | sha256sum | awk '{print $1}')

          # Switch to main so the commit lands on the right branch
          git fetch origin main
          git checkout -B main origin/main

          # Patch the formula in-place
          sed -i "s|url \".*\"|url \"${TARBALL_URL}\"|"   Formula/nix-config-collector.rb
          sed -i "s|sha256 \".*\"|sha256 \"${SHA256}\"|"  Formula/nix-config-collector.rb

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/nix-config-collector.rb
          git commit -m "chore: update Homebrew formula for ${TAG}"
          git push origin main
